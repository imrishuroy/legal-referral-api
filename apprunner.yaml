version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Build started on `date`"
      - echo "Building the Docker image..."          
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - echo "Build completed on `date`"
  finally:
    - echo "This always runs even if the build fails"
run:
  runtime-version: latest
  command: /app/main
  network:
    port: 8080
    env: PORT
  env:
    # Environment variables will be managed through App Runner service configuration
    # or AWS Secrets Manager integration
    - name: ENV
      value: "prod"
